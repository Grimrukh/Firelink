name: Build and Test DLLs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Checkout the code.
      - name: Checkout code
        uses: actions/checkout@v6

      # CMake 3.31 is already installed on the Windows runner.
      - name: Verify CMake version
        run: cmake --version

      # The "Visual Studio 17 2022" CMake generator relies on locating a full
      # VS IDE install, which isn't reliably present on GitHub's Windows
      # runners. Instead, activate the MSVC compiler toolset directly (still
      # required for DirectXTex/COM/WRL code, which MinGW GCC can't build
      # reliably) and drive the build with Ninja, which just needs cl.exe on
      # PATH.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Configure with CMake (Release) using Ninja + MSVC.
      - name: Configure CMake with MSVC (Ninja)
        run: >
          cmake -S . -B cmake-build-release
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl

      # Build the project (Release).
      - name: Build the DLLs
        run: cmake --build cmake-build-release

      # Run tests.
      - name: Run Tests
        run: ctest --test-dir cmake-build-release --output-on-failure --verbose
